<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界じゃんけん</title>
<style>
:root{--bg:#0f1220;--fg:#f2f4ff;--sub:#8b92b8;--card:#1a1f38;--acc:#ffcc4d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
h1{margin:0;font-size:1.6rem}
.stats{color:var(--sub);font-size:.85rem}
.stage{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:420px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.opp{font-size:1rem;color:var(--sub)}.opp b{font-size:2rem;display:block}
.hands{display:flex;gap:14px}
.hands button{font-size:2.6rem;width:88px;height:88px;border-radius:50%;border:0;background:#262c4d;cursor:pointer}
.hands button:disabled{opacity:.35;cursor:default}
.hands button:not(:disabled):active{transform:scale(.92)}
.big{font-size:3.2rem}.msg{font-size:1.2rem}
.go{background:var(--acc);color:#222;border:0;border-radius:99px;padding:12px 28px;font-size:1rem;font-weight:700;cursor:pointer}
.shake{animation:sh .18s 4}@keyframes sh{50%{transform:translateY(-10px)}}
.win{color:#5dffa0}.lose{color:#ff7a7a}
.chat{width:100%;display:flex;flex-direction:column;gap:8px}.chat[hidden]{display:none}
.log{height:84px;overflow-y:auto;background:#12162b;border-radius:10px;padding:6px 10px;text-align:left;font-size:.85rem}
.log .me{color:var(--acc)}.log .them{color:#9fd0ff}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.presets button{background:#262c4d;color:var(--fg);border:0;border-radius:99px;padding:6px 12px;font-size:.8rem;cursor:pointer}
.free{display:flex;gap:6px}.free input{flex:1;background:#12162b;color:var(--fg);border:1px solid #303760;border-radius:10px;padding:8px;font-size:.9rem}
.free button{background:var(--acc);border:0;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.lb{background:#12162b;color:var(--fg);border:1px solid #303760;border-radius:10px;padding:6px 10px;font-size:.85rem}
</style>
</head>
<body>
<h1>✊✋✌️ 世界じゃんけん</h1>
<div class="stats" id="stats">接続中…</div>
<select class="lb" id="lb"></select>
<div class="stage">
  <div class="opp" id="opp"></div>
  <div class="big" id="big"></div>
  <div class="msg" id="msg">「対戦相手を探す」を押してください</div>
  <div class="hands" id="hands">
    <button data-m="r" disabled>✊</button><button data-m="s" disabled>✌️</button><button data-m="p" disabled>✋</button>
  </div>
  <div class="chat" id="chat" hidden>
    <div class="log" id="log"></div>
    <div class="presets" id="presets"></div>
    <div class="free"><input id="ci" maxlength="40" placeholder="自由に一言（40字まで）"><button id="cs">送信</button></div>
  </div>
  <button class="go" id="go">対戦相手を探す</button>
</div>
<div class="stats" id="score">0勝 0敗 0分</div>
<script>
const E={r:"✊",s:"✌️",p:"✋"};
const $=id=>document.getElementById(id);
const flag=c=>/^[A-Z]{2}$/.test(c)&&c!=="XX"&&c!=="T1"?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt())):"🌐";
const sc={win:0,lose:0,draw:0};
const REG={AS:["アジア",2],EU:["ヨーロッパ",2],NA:["北米",2],SA:["南米",1],OC:["オセアニア",1],AF:["アフリカ",1]};
const lbName=id=>{const [r,n]=(id||"").split("-");return REG[r]?REG[r][0]+(REG[r][1]>1?` 第${n}`:"")+"ロビー":"ロビー"};
let LB="";
$("lb").innerHTML='<option value="">自動（近くのロビー）</option>'+Object.entries(REG).flatMap(([r,[n,c]])=>Array.from({length:c},(_,i)=>`<option value="${r}-${i+1}">${lbName(r+"-"+(i+1))}</option>`)).join("");
$("lb").onchange=()=>{LB=$("lb").value;ws.onclose=null;ws.close();showChat(false);setHands(false);$("big").textContent="";$("opp").textContent="";$("msg").textContent="「対戦相手を探す」を押してください";$("go").hidden=false;$("go").textContent="対戦相手を探す";$("go").disabled=true;connect()};
let ws,hands=[...document.querySelectorAll(".hands button")];
const setHands=on=>hands.forEach(b=>b.disabled=!on);
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws"+(LB?"?lobby="+LB:""));
  ws.onopen=()=>{$("go").disabled=false};
  ws.onclose=()=>{$("stats").textContent="切断されました。再接続中…";$("go").disabled=true;setHands(false);setTimeout(connect,2000)};
  ws.onmessage=e=>on(JSON.parse(e.data));
}
function on(m){
  if(m.type==="stats")$("stats").textContent=`🌍 ${lbName(m.lobby)} ・ いま ${m.online} 人 ・ 累計 ${m.total} 回`;
  else if(m.type==="waiting"){$("msg").textContent="世界のだれかを探しています…";$("opp").innerHTML="";$("big").textContent="🔍";$("go").hidden=true;showChat(false)}
  else if(m.type==="matched"){$("opp").innerHTML=`${m.ghost?"👻 ゴースト（過去の誰かの手）":"対戦相手"}<b>${flag(m.country)}</b>`;$("big").textContent="";$("msg").textContent="手を選んでください";setHands(true);showChat(!m.ghost)}
  else if(m.type==="locked")$("msg").textContent="相手の手を待っています…";
  else if(m.type==="left"){$("msg").textContent="相手が退出しました";setHands(false);showChat(false);$("go").hidden=false;$("go").textContent="次の相手を探す"}
  else if(m.type==="chat")addLog(m);
  else if(m.type==="result")reveal(m);
}
function reveal(m){
  setHands(false);showChat(false);$("msg").textContent="じゃん…けん…";$("big").textContent="✊";$("big").className="big shake";
  setTimeout(()=>{
    $("big").className="big";$("big").textContent=`${E[m.you]} vs ${E[m.opp]}`;
    const t={win:"勝ち！",lose:"負け…",draw:"あいこ"}[m.outcome];
    $("msg").innerHTML=`<span class="${m.outcome}">${t}</span>`;
    sc[m.outcome]++;$("score").textContent=`${sc.win}勝 ${sc.lose}敗 ${sc.draw}分`;
    $("go").hidden=false;$("go").textContent="次の相手を探す";
  },800);
}
const PRE=["次はグーを出すよ✊","パーは出さない😏","さっきと同じ手にする","緊張してる？","勝ったな…","運命を信じろ"];
function showChat(on){$("chat").hidden=!on;if(on)$("log").textContent=""}
function addLog(m){const d=document.createElement("div");d.className=m.mine?"me":"them";d.textContent=(m.mine?"あなた: ":"相手: ")+m.text;const l=$("log");l.appendChild(d);while(l.children.length>30)l.firstChild.remove();l.scrollTop=l.scrollHeight}
function sendChat(t){t=t.trim();if(t&&ws.readyState===1)ws.send(JSON.stringify({type:"chat",text:t}))}
PRE.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>sendChat(t);$("presets").appendChild(b)});
$("cs").onclick=()=>{sendChat($("ci").value);$("ci").value=""};
$("ci").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){sendChat($("ci").value);$("ci").value=""}};
hands.forEach(b=>b.onclick=()=>{ws.send(JSON.stringify({type:"move",move:b.dataset.m}));setHands(false);$("msg").textContent="送信しました…"});
$("go").onclick=()=>ws.send(JSON.stringify({type:"join"}));
$("go").disabled=true;connect();
</script>
</body>
</html>
